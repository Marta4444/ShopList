<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E7D4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Compra">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>Compra</title>
</head>
<body>
<main id="app"></main>

<nav aria-label="Secciones">
  <button data-act="nav" data-view="home">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Listas
  </button>
  <button data-act="nav" data-view="history">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Historial
  </button>
  <button data-act="nav" data-view="settings">
    <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Ajustes
  </button>
</nav>

<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importfile" accept="application/json,.json" hidden>
<input type="file" id="photofile" accept="image/*" hidden>
<input type="file" id="photocam" accept="image/*" capture="environment" hidden>

<noscript>Esta app necesita JavaScript activado.</noscript>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
